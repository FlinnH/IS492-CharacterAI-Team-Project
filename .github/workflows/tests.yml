# Runs the app's tests on every push and every pull request.
# The tests use the fake model, so this needs no key and no secret.
# The CP4 public link will deploy from main only after this check passes.

name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Get the code
        uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install app/requirements.txt
        run: python -m pip install -r app/requirements.txt
      - name: Run the tests
        run: python -m pytest
