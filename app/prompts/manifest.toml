# The prompt files in use and the sha256 of every prompt file.
#
# app/workbench/config.py refuses to start when a file's hash differs, because a
# prompt that was used never changes. To change one, save a new version (like
# models.v2.toml), add its hash below, and point [current] at it. Older
# versions stay listed, so the versions in old log rows still mean one text.

[current]
models = "models.v4.toml"
character = "character.v1.md"
judge = "judge.v1.md"
judge_schema = "judge.schema.v1.json"
recheck = "recheck.v1.md"
recheck_schema = "recheck.schema.v1.json"

